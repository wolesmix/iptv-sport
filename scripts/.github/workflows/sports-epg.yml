name: Generate Sports EPG

on:
  workflow_dispatch:

  schedule:
    # Setiap hari pukul 00:00 dan 12:00 UTC
    # Sama dengan pukul 07:00 dan 19:00 WIB
    - cron: "0 0,12 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sports-epg-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate EPG channel mapping
        run: |
          python scripts/generate_channels.py

      - name: Download XMLTV engine
        run: |
          git clone --depth 1 \
            https://github.com/iptv-org/epg.git \
            epg-engine

      - name: Install EPG dependencies
        working-directory: epg-engine
        run: npm install

      - name: Prepare output folder
        run: mkdir -p public

      - name: Generate XMLTV guide
        working-directory: epg-engine
        run: |
          npm run grab -- \
            --channels=../epg-channels.xml \
            --output=../public/sports-epg.xml \
            --days=2 \
            --maxConnections=5 \
            --timeout=60000

      - name: Validate XMLTV output
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          path = Path("public/sports-epg.xml")

          if not path.exists():
              raise SystemExit("File sports-epg.xml tidak ditemukan")

          if path.stat().st_size < 100:
              raise SystemExit("File XMLTV terlalu kecil")

          root = ET.parse(path).getroot()

          if root.tag != "tv":
              raise SystemExit("Format XMLTV tidak valid")

          print("XMLTV valid")
          print("Channel:", len(root.findall("channel")))
          print("Program:", len(root.findall("programme")))
          PY

      - name: Copy unmatched report
        run: |
          cp epg-unmatched.json public/epg-unmatched.json

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
